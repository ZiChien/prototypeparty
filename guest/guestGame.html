<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任務頁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen pb-20">
    <!-- 頂部導航欄 -->
    <header class="sticky top-0 z-10 bg-white shadow-sm">
        <div class="flex justify-between items-center p-4">
            <h1 class="text-xl font-semibold">任務中心</h1>
        </div>
    </header>

    <!-- 頂部掃描QR Code提示 -->
    <div class="bg-blue-50 p-3 mx-4 my-3 rounded-xl flex items-center justify-between">
        <div class="flex items-center text-blue-700 text-sm">
            <i class="fas fa-info-circle mr-2"></i>
            <span>掃描攤位提供的QR Code來完成任務</span>
        </div>
        <button id="scan-qr-btn" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white text-blue-700 shadow-sm">
            <i class="fas fa-qrcode text-xl"></i>
        </button>
    </div>

    <!-- 任務列表 -->
    <div class="px-4 space-y-6">
        <!-- 美食探索任務 -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <!-- 任務封面 -->
            <div class="relative h-40">
                <img src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" 
                     alt="美食探索" 
                     class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-4">
                    <div class="text-white">
                        <h3 class="text-xl font-bold">美食探索</h3>
                        <p class="text-sm opacity-90">收集美食攤位印章</p>
                    </div>
                </div>
            </div>
            
            <!-- 任務進度 -->
            <div class="p-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm text-gray-600">完成進度</span>
                    <span class="text-sm text-blue-600 font-medium">2/6 關卡</span>
                </div>
                <div class="h-2 bg-gray-100 rounded-full overflow-hidden">
                    <div class="h-full bg-blue-500 rounded-full" style="width: 40%"></div>
                </div>
            </div>

            <!-- 關卡印章列表 -->
            <div class="p-4 pt-0">
                <div class="grid grid-cols-4 gap-4">
                    <!-- 已完成的關卡 -->
                    <div class="relative group" onclick="openTaskDetail('stage1')">
                        <div class="w-full pb-[100%] rounded-full bg-gray-100 shadow-sm relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1562967916-eb82221dfb92?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" 
                                 alt="鹹酥雞攤位" 
                                 class="absolute inset-0 w-full h-full object-cover opacity-40">
                            <div class="absolute inset-0 flex items-center justify-center bg-black/10">
                                <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center">
                                    <i class="fas fa-check text-white text-lg"></i>
                                </div>
                            </div>
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs font-medium">鹹酥雞攤位</span>
                        </div>
                    </div>

                    <div class="relative group" onclick="openTaskDetail('stage4')">
                        <div class="w-full pb-[100%] rounded-full bg-gray-100 shadow-sm relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1563245372-f21724e3856d?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" 
                                 alt="中式料理" 
                                 class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs font-medium">中式料理</span>
                        </div>
                    </div>

                    <div class="relative group" onclick="openTaskDetail('stage5')">
                        <div class="w-full pb-[100%] rounded-full bg-gray-100 shadow-sm relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" 
                                 alt="異國風味" 
                                 class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs font-medium">異國風味</span>
                        </div>
                    </div>

                    <div class="relative group" onclick="openTaskDetail('stage6')">
                        <div class="w-full pb-[100%] rounded-full bg-gray-100 shadow-sm relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1547592180-85f173990554?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" 
                                 alt="夢幻投籃機" 
                                 class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs font-medium">夢幻投籃機</span>
                        </div>
                    </div>

                    <div class="relative group" onclick="openTaskDetail('stage7')">
                        <div class="w-full pb-[100%] rounded-full bg-gray-100 shadow-sm relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1558180077-09f158c76707?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" 
                                 alt="套圈圈" 
                                 class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs font-medium">套圈圈</span>
                        </div>
                    </div>

                    <div class="relative group" onclick="openTaskDetail('stage9')">
                        <div class="w-full pb-[100%] rounded-full bg-gray-100 shadow-sm relative overflow-hidden">
                            <img src="https://images.unsplash.com/photo-1525351159099-81893194469e?ixlib=rb-1.2.1&auto=format&fit=crop&w=100&q=80" 
                                 alt="射擊遊戲" 
                                 class="absolute inset-0 w-full h-full object-cover">
                        </div>
                        <div class="mt-2 text-center">
                            <span class="text-xs font-medium">射擊遊戲</span>
                        </div>
                    </div>
                </div>

                <!-- 任務獎勵 -->
                <div class="mt-6">
                    <button onclick="showRedeemModal()" class="w-full py-3 bg-yellow-500 hover:bg-yellow-600 text-white font-medium rounded-xl flex items-center justify-center transition">
                        <i class="fas fa-gift mr-2"></i>
                        兌換任務獎勵
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部導航欄 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white shadow-lg border-t border-gray-200">
        <div class="flex justify-around">
            <a href="guestHome.html" class="flex flex-col items-center py-2 px-3 text-gray-500">
                <i class="fas fa-home text-xl"></i>
                <span class="text-xs mt-1">首頁</span>
            </a>
            <a href="guestBooth.html" class="flex flex-col items-center py-2 px-3 text-gray-500">
                <i class="fas fa-store text-xl"></i>
                <span class="text-xs mt-1">攤位</span>
            </a>
            <a href="guestGame.html" class="flex flex-col items-center py-2 px-3 text-blue-500">
                <i class="fas fa-tasks text-xl"></i>
                <span class="text-xs mt-1">任務</span>
            </a>
            <a href="guestPayment.html" class="flex flex-col items-center py-2 px-3 text-gray-500">
                <i class="fas fa-wallet text-xl"></i>
                <span class="text-xs mt-1">支付</span>
            </a>
            <a href="guestAccount.html" class="flex flex-col items-center py-2 px-3 text-gray-500">
                <i class="fas fa-user text-xl"></i>
                <span class="text-xs mt-1">我的</span>
            </a>
        </div>
    </nav>

    <!-- 任務詳情模態框 -->
    <div id="task-detail-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white w-11/12 max-w-md rounded-xl overflow-hidden">
            <div class="relative">
                <img id="task-modal-image" src="" alt="任務圖片" class="w-full h-48 object-cover">
                <button onclick="closeTaskDetail()" class="absolute top-4 right-4 bg-white rounded-full w-8 h-8 flex items-center justify-center shadow-md">
                    <i class="fas fa-times text-gray-600"></i>
                </button>
            </div>
            <div class="p-4">
                <h3 id="task-modal-title" class="text-xl font-bold mb-2"></h3>
                <div class="flex items-center mt-2 mb-4">
                    <i class="fas fa-map-marker-alt text-gray-500 mr-2"></i>
                    <p id="task-modal-location" class="text-sm text-gray-600"></p>
                </div>
                <div class="mb-4">
                    <h4 class="font-medium mb-2">任務介紹</h4>
                    <p id="task-modal-description" class="text-sm text-gray-600"></p>
                </div>
                <div class="mb-4">
                    <h4 class="font-medium mb-2">任務獎勵</h4>
                    <div class="flex items-center text-sm text-gray-600">
                        <i class="fas fa-coins text-yellow-500 mr-2"></i>
                        <span id="task-modal-reward"></span>
                    </div>
                </div>
                <button onclick="showScanModal()" class="w-full py-2.5 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 transition flex items-center justify-center">
                    <i class="fas fa-qrcode mr-2"></i>
                    掃描QR碼完成任務
                </button>
            </div>
        </div>
    </div>

    <!-- 掃描QR碼模態框 -->
    <div id="scan-modal" class="fixed inset-0 bg-black bg-opacity-75 z-50 flex flex-col items-center justify-center hidden">
        <div class="bg-white w-11/12 max-w-sm rounded-xl overflow-hidden mb-20">
            <div class="relative">
                <div class="w-full aspect-square bg-gray-900 flex items-center justify-center">
                    <div class="w-4/5 h-4/5 border-2 border-white/70 relative">
                        <div class="absolute top-0 left-0 w-5 h-5 border-t-2 border-l-2 border-blue-500"></div>
                        <div class="absolute top-0 right-0 w-5 h-5 border-t-2 border-r-2 border-blue-500"></div>
                        <div class="absolute bottom-0 left-0 w-5 h-5 border-b-2 border-l-2 border-blue-500"></div>
                        <div class="absolute bottom-0 right-0 w-5 h-5 border-b-2 border-r-2 border-blue-500"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <p class="text-white text-sm">瞄準QR碼</p>
                        </div>
                    </div>
                </div>
                <button onclick="closeScanModal()" class="absolute top-4 right-4 bg-white/20 rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fas fa-times text-white"></i>
                </button>
            </div>
            <div class="p-4">
                <p class="text-sm text-gray-600 mb-4 text-center">掃描攤位提供的QR碼以完成任務</p>
                <button onclick="simulateSuccessScan()" class="w-full py-2.5 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 transition">
                    模擬掃描成功
                </button>
            </div>
        </div>
    </div>

    <!-- 掃描成功模態框（關卡完成） -->
    <div id="success-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white w-11/12 max-w-sm rounded-xl overflow-hidden p-4">
            <div class="text-center mb-6">
                <div class="w-20 h-20 rounded-full bg-green-100 flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-3xl text-green-500"></i>
                </div>
                <h3 class="text-xl font-bold mb-1">關卡完成！</h3>
                <p class="text-sm text-gray-600" id="success-modal-message"></p>
            </div>
            <div class="p-3 bg-yellow-50 rounded-lg mb-4">
                <div class="flex items-start">
                    <i class="fas fa-coins text-yellow-500 mt-1 mr-2"></i>
                    <div>
                        <h4 class="font-medium text-sm">獲得獎勵</h4>
                        <p class="text-xs text-gray-600" id="success-modal-reward"></p>
                    </div>
                </div>
            </div>
            <button onclick="closeSuccessModal()" class="w-full py-2.5 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 transition">
                確定
            </button>
        </div>
    </div>

    <!-- 獎勵兌換券模態框 -->
    <div id="voucher-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white w-11/12 max-w-sm rounded-xl overflow-hidden">
            <!-- 兌換券設計 -->
            <div class="relative">
                <div class="absolute inset-x-0 top-0 h-16 bg-yellow-500"></div>
                <div class="relative pt-8 px-6 pb-6">
                    <!-- 兌換券標題區 -->
                    <div class="bg-white rounded-xl shadow-lg p-4 text-center relative">
                        <div class="absolute -top-8 left-1/2 transform -translate-x-1/2">
                            <div class="w-16 h-16 rounded-full bg-yellow-500 border-4 border-white flex items-center justify-center">
                                <i class="fas fa-gift text-2xl text-white"></i>
                            </div>
                        </div>
                        <h3 class="text-xl font-bold mt-6 mb-1">美食探索獎勵券</h3>
                        <p class="text-sm text-gray-600">恭喜完成美食探索任務！</p>
                        
                        <!-- 虛線分隔 -->
                        <div class="my-4 border-t border-dashed border-gray-200 relative">
                            <div class="absolute -left-10 -mt-2 w-4 h-4 rounded-full bg-gray-100"></div>
                            <div class="absolute -right-10 -mt-2 w-4 h-4 rounded-full bg-gray-100"></div>
                        </div>
                        
                        <!-- 獎勵內容 -->
                        <div class="space-y-3">
                            <div class="flex items-center justify-center">
                                <i class="fas fa-coins text-yellow-500 text-xl mr-2"></i>
                                <span class="text-lg font-bold text-yellow-600">+200 園遊會幣</span>
                            </div>
                            <div class="flex items-center justify-center">
                                <i class="fas fa-medal text-yellow-500 text-xl mr-2"></i>
                                <span class="text-lg font-bold text-yellow-600">限定美食勳章</span>
                            </div>
                        </div>

                        <!-- 兌換券編號 -->
                        <div class="mt-4 pt-4 border-t border-dashed border-gray-200">
                            <div class="text-xs text-gray-500">兌換券編號</div>
                            <div class="font-mono text-sm" id="voucher-number"></div>
                        </div>
                    </div>

                    <!-- 底部按鈕 -->
                    <div class="mt-6">
                        <button onclick="closeVoucherModal()" class="w-full py-3 bg-gray-100 text-gray-600 font-medium rounded-xl hover:bg-gray-200 transition">
                            關閉
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 兌換獎勵模態框 -->
    <div id="redeem-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
        <div class="bg-white w-11/12 max-w-sm rounded-xl overflow-hidden">
            <div class="relative">
                <img src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" 
                     alt="美食探索" 
                     class="w-full h-40 object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent flex items-end p-4">
                    <div class="text-white">
                        <h3 class="text-xl font-bold">美食探索獎勵</h3>
                        <p class="text-sm opacity-90">完成指定關卡即可兌換</p>
                    </div>
                </div>
                <button onclick="closeRedeemModal()" class="absolute top-4 right-4 bg-white/20 rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fas fa-times text-white"></i>
                </button>
            </div>
            
            <div class="p-4">
                <div class="mb-4">
                    <h4 class="font-medium mb-2">任務說明</h4>
                    <p class="text-sm text-gray-600">完成任意5個關卡即可獲得豐厚獎勵，目前進度：2/6</p>
                </div>
                
                <div class="p-3 bg-yellow-50 rounded-lg mb-6">
                    <div class="flex items-start">
                        <i class="fas fa-award text-yellow-500 mt-1 mr-2"></i>
                        <div>
                            <h4 class="font-medium text-sm">獎勵內容</h4>
                            <p class="text-xs text-gray-600">200點園遊會幣 + 限定美食勳章</p>
                        </div>
                    </div>
                </div>

                <!-- 滑動解鎖區域 -->
                <div id="slide-to-unlock" class="relative h-12 bg-gray-100 rounded-full mb-4 select-none touch-none">
                    <div class="absolute inset-y-0 left-0 w-12 bg-blue-500 rounded-full cursor-grab active:cursor-grabbing" 
                         id="slider-thumb">
                        <div class="h-full flex items-center justify-center text-white">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <span class="text-sm text-gray-500" id="slider-text">此步驟由工作人員操作</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 任務詳情模態框
        const taskDetailModal = document.getElementById('task-detail-modal');
        const taskModalImage = document.getElementById('task-modal-image');
        const taskModalTitle = document.getElementById('task-modal-title');
        const taskModalLocation = document.getElementById('task-modal-location');
        const taskModalDescription = document.getElementById('task-modal-description');
        const taskModalReward = document.getElementById('task-modal-reward');
        
        // 掃描QR碼模態框
        const scanModal = document.getElementById('scan-modal');
        
        // 掃描成功模態框
        const successModal = document.getElementById('success-modal');
        const successModalMessage = document.getElementById('success-modal-message');
        const successModalReward = document.getElementById('success-modal-reward');
        
        // QR碼掃描按鈕
        const scanQrBtn = document.getElementById('scan-qr-btn');
        
        // 兌換獎勵相關功能
        const redeemModal = document.getElementById('redeem-modal');
        const sliderThumb = document.getElementById('slider-thumb');
        const sliderText = document.getElementById('slider-text');
        let isDragging = false;
        let startX;
        let sliderLeft;
        
        // 打開任務詳情
        function openTaskDetail(taskId) {
            // 根據不同任務ID設置不同的詳情內容
            let title, location, description, imageSrc, reward;
            
            switch(taskId) {
                case 'stage1':
                    title = '鹹酥雞攤位';
                    location = 'A1區 (中央廣場北側)';
                    description = '訪問鹹酥雞攤位，品嚐美味小吃並完成打卡任務。';
                    imageSrc = 'https://images.unsplash.com/photo-1562967916-eb82221dfb92?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
                    reward = '+20 園遊會幣';
                    break;
                case 'stage4':
                    title = '中式料理';
                    location = 'A4區 (美食區)';
                    description = '訪問中式料理攤位，品嚐傳統中式美食，完成任務可獲得園遊會幣獎勵。';
                    imageSrc = 'https://images.unsplash.com/photo-1563245372-f21724e3856d?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
                    reward = '+20 園遊會幣';
                    break;
                case 'stage5':
                    title = '異國風味';
                    location = 'A5區 (美食區)';
                    description = '訪問異國風味攤位，體驗來自世界各地的特色美食，完成任務可獲得園遊會幣獎勵。';
                    imageSrc = 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
                    reward = '+20 園遊會幣';
                    break;
                case 'stage6':
                    title = '夢幻投籃機';
                    location = 'C1區 (操場區域)';
                    description = '挑戰30秒內投中籃框次數，完成遊戲並掃描QR碼獲得獎勵。';
                    imageSrc = 'https://images.unsplash.com/photo-1547592180-85f173990554?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
                    reward = '+30 園遊會幣';
                    break;
                case 'stage7':
                    title = '套圈圈';
                    location = 'C2區 (遊戲區)';
                    description = '挑戰將圈套中獎品，完成遊戲並掃描QR碼獲得獎勵。';
                    imageSrc = 'https://images.unsplash.com/photo-1558180077-09f158c76707?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
                    reward = '+30 園遊會幣';
                    break;
                case 'stage9':
                    title = '射擊遊戲';
                    location = 'C4區 (遊戲區)';
                    description = '挑戰射擊遊戲，擊中目標獲得分數，完成遊戲並掃描QR碼獲得獎勵。';
                    imageSrc = 'https://images.unsplash.com/photo-1525351159099-81893194469e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
                    reward = '+30 園遊會幣';
                    break;
            }
            
            taskModalTitle.textContent = title;
            taskModalLocation.textContent = location;
            taskModalDescription.textContent = description;
            taskModalImage.src = imageSrc;
            taskModalReward.textContent = reward;
            
            taskDetailModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        // 關閉任務詳情
        function closeTaskDetail() {
            taskDetailModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
        
        // 點擊模態框外部關閉
        taskDetailModal.addEventListener('click', function(e) {
            if (e.target === taskDetailModal) {
                closeTaskDetail();
            }
        });
        
        // 掃描QR碼功能
        scanQrBtn.addEventListener('click', function() {
            scanModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        });
        
        // 顯示掃描QR碼模態框
        function showScanModal() {
            closeTaskDetail();
            scanModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        // 關閉掃描QR碼模態框
        function closeScanModal() {
            scanModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
        
        // 點擊掃描QR碼模態框外部關閉
        scanModal.addEventListener('click', function(e) {
            if (e.target === scanModal) {
                closeScanModal();
            }
        });
        
        // 生成兌換券編號
        function generateVoucherNumber() {
            const timestamp = new Date().getTime().toString().slice(-8);
            const random = Math.random().toString(36).substring(2, 6).toUpperCase();
            return `SF${timestamp}${random}`;
        }
        
        // 模擬掃描成功（關卡完成）
        function simulateSuccessScan() {
            closeScanModal();
            
            // 設置關卡完成獎勵內容
            const taskMessages = [
                '恭喜完成「中式料理」任務',
                '恭喜完成「異國風味」任務',
                '恭喜完成「射擊遊戲」任務'
            ];
            const rewards = ['+20 園遊會幣', '+30 園遊會幣'];
            
            successModalMessage.textContent = taskMessages[Math.floor(Math.random() * taskMessages.length)];
            successModalReward.textContent = rewards[Math.floor(Math.random() * rewards.length)];
            
            successModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        // 顯示獎勵兌換券
        function showVoucherModal() {
            document.getElementById('voucher-number').textContent = generateVoucherNumber();
            document.getElementById('voucher-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        
        // 關閉獎勵兌換券
        function closeVoucherModal() {
            document.getElementById('voucher-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // 兌換獎勵相關功能
        function showRedeemModal() {
            redeemModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            resetSlider();
        }

        function closeRedeemModal() {
            redeemModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            resetSlider();
        }

        function resetSlider() {
            sliderThumb.style.left = '0px';
            sliderText.textContent = '此步驟由工作人員操作';
            sliderText.classList.remove('text-green-500');
            sliderThumb.classList.remove('bg-green-500');
        }

        // 滑動解鎖相關事件
        sliderThumb.addEventListener('mousedown', startDragging);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDragging);

        // 觸控事件支援
        sliderThumb.addEventListener('touchstart', startDragging);
        document.addEventListener('touchmove', drag);
        document.addEventListener('touchend', stopDragging);

        function startDragging(e) {
            isDragging = true;
            startX = (e.type === 'mousedown') ? e.clientX : e.touches[0].clientX;
            sliderLeft = sliderThumb.offsetLeft;
        }

        function drag(e) {
            if (!isDragging) return;
            
            e.preventDefault();
            const x = (e.type === 'mousemove') ? e.clientX : e.touches[0].clientX;
            const walk = x - startX;
            const newLeft = sliderLeft + walk;
            
            const container = sliderThumb.parentElement;
            const maxLeft = container.offsetWidth - sliderThumb.offsetWidth;
            
            if (newLeft < 0) {
                sliderThumb.style.left = '0px';
            } else if (newLeft > maxLeft) {
                sliderThumb.style.left = maxLeft + 'px';
                unlockReward();
            } else {
                sliderThumb.style.left = newLeft + 'px';
            }
        }

        function stopDragging() {
            if (!isDragging) return;
            
            isDragging = false;
            const maxLeft = sliderThumb.parentElement.offsetWidth - sliderThumb.offsetWidth;
            const currentLeft = sliderThumb.offsetLeft;
            
            if (currentLeft < maxLeft) {
                // 如果未滑到底，回彈到起始位置
                sliderThumb.style.left = '0px';
            }
        }

        function unlockReward() {
            sliderText.textContent = '獎勵兌換成功！';
            sliderText.classList.add('text-green-500');
            sliderThumb.classList.add('bg-green-500');
            
            // 延遲關閉模態框並顯示兌換券
            setTimeout(() => {
                closeRedeemModal();
                showVoucherModal();
            }, 1000);
        }

        // 點擊模態框外部關閉
        redeemModal.addEventListener('click', function(e) {
            if (e.target === redeemModal) {
                closeRedeemModal();
            }
        });

        // 關閉掃描成功模態框
        function closeSuccessModal() {
            successModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // 點擊掃描成功模態框外部關閉
        successModal.addEventListener('click', function(e) {
            if (e.target === successModal) {
                closeSuccessModal();
            }
        });
    </script>
</body>
</html>
