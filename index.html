<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>園遊會App原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .page-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
            color: #222;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
        }

        .phone-container {
            width: 390px;
            height: 844px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
        }

        .desktop-container {
            width: 1380px;
            height: 844px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
        }

        .screen {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .devices-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
    </style>
</head>

<body>
    <h1 class="text-3xl font-bold mb-6">園遊會App原型展示</h1>

    <!-- 遊客端頁面 -->
    <div class="section-title">遊客端頁面</div>
    <div id="guest-container" class="devices-container">
        <!-- 首頁 -->
        <div>
            <div class="page-title">首頁</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="guest/guestHome.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 攤位頁 -->
        <div>
            <div class="page-title">攤位頁</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="guest/guestBooth.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 任務頁 -->
        <div>
            <div class="page-title">任務頁</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="guest/guestGame.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 支付頁 -->
        <div>
            <div class="page-title">支付頁</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="guest/guestPayment.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 個人中心 -->
        <div>
            <div class="page-title">個人中心</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="guest/guestAccount.html"></iframe>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 商家端頁面 -->
    <div class="section-title">商家端頁面</div>
    <div id="booth-container" class="devices-container">
        <!-- 收款頁 -->
        <div>
            <div class="page-title">收款頁</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="booth/boothReceive.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 任務頁 -->
        <div>
            <div class="page-title">任務集章頁</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="booth/boothGame.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 攤位管理 -->
        <div>
            <div class="page-title">攤位管理</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="booth/boothSetting.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 攤位帳號 -->
        <div>
            <div class="page-title">攤位帳號</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="booth/boothAccount.html"></iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- 主辦端頁面 -->
    <div class="section-title">主辦端頁面</div>
    <div id="org-container" class="devices-container">
        <!-- 活動設定頁面 -->
        <div>
            <div class="page-title">活動設定頁面</div>
            <div class="desktop-container">
                <div class="screen">
                    <iframe src="org/eventAdmin.html"></iframe>
                </div>
            </div>
        </div>
        
        <!-- 點數管理頁面 -->
        <div>
            <div class="page-title">點數管理頁面</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="org/paymentAdmin.html"></iframe>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
