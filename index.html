<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>園遊會App原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .page-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 32px;
            font-weight: bold;
            margin: 30px 0;
            color: #222;
            border-bottom: 3px solid #3b82f6;
            padding-bottom: 10px;
        }

        .phone-container {
            width: 390px;
            height: 844px;
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
        }

        .desktop-container {
            width: 1380px;
            height: 844px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 50px;
        }

        .screen {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .page-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .devices-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
    </style>
</head>

<body>
    <h1 class="text-3xl font-bold mb-6">園遊會App原型展示</h1>

    <!-- 遊客端頁面 -->
    <div class="section-title">遊客端頁面</div>
    <div id="guest-container" class="devices-container">
        <!-- 首頁 -->
        <!-- <div>
            <div class="page-title">首頁</div>
            <div class="phone-container">
                <div class="screen">
                    <iframe src="guest/guestHome.html"></iframe>
                </div>
            </div>
        </div> -->
    </div>
</body>

</html>
