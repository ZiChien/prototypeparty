<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>攤位管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- 頂部導航欄 -->
    <header class="bg-white shadow-sm">
        <div class="max-w-screen-xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">攤位管理</h1>
        </div>
    </header>

    <!-- 主要內容 -->
    <main class="px-4 py-6 pb-20">
        <!-- 攤位基本資訊 -->
        <section class="mb-6">
            <div class="bg-white rounded-xl shadow-sm p-5">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold">攤位基本資訊</h2>
                    <button onclick="toggleEditMode()" class="text-blue-500 text-sm flex items-center">
                        <i class="fas fa-edit mr-1"></i> 編輯
                    </button>
                </div>
                
                <div id="view-mode" class="space-y-4">
                    <div class="flex items-center">
                        <div class="w-20 h-20 bg-gray-200 rounded-lg overflow-hidden mr-4">
                            <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1374&q=80" 
                                 alt="攤位照片" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <h3 class="font-semibold text-lg">美味小食攤</h3>
                        </div>
                    </div>
                    
                    <div class="space-y-3 mt-3">
                        <div>
                            <p class="text-gray-500 text-xs">攤位類型</p>
                            <p class="font-medium">美食類</p>
                        </div>
                        
                        <div>
                            <p class="text-gray-500 text-xs">攤位位置</p>
                            <p class="font-medium">A區 - 第3排 - 5號</p>
                        </div>
                        
                        <div>
                            <p class="text-gray-500 text-xs">營業時間</p>
                            <p class="font-medium">09:00 - 17:00</p>
                        </div>
                        
                        <div>
                            <p class="text-gray-500 text-xs">攤位介紹</p>
                            <p class="font-medium">提供各式各樣的美味小食，包括炸雞、薯條、漢堡等。使用新鮮食材，現點現做！</p>
                        </div>
                    </div>
                </div>
                
                <!-- 編輯模式 -->
                <div id="edit-mode" class="hidden space-y-4">
                    <div class="flex items-center">
                        <div class="w-20 h-20 bg-gray-200 rounded-lg overflow-hidden mr-4 relative">
                            <img id="booth-image-preview" src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1374&q=80" 
                                 alt="攤位照片" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity cursor-pointer" onclick="document.getElementById('booth-image').click()">
                                <i class="fas fa-camera text-white"></i>
                            </div>
                            <input type="file" id="booth-image" class="hidden" accept="image/*" onchange="previewImage(event)">
                        </div>
                        <div>
                            <input type="text" id="booth-name" value="美味小食攤" class="border rounded-lg px-3 py-1 w-full text-lg font-semibold mb-1">
                        </div>
                    </div>
                    
                    <div class="space-y-3 mt-3">
                        <div>
                            <label class="text-gray-500 text-xs block mb-1" for="booth-type">攤位類型</label>
                            <select id="booth-type" class="border rounded-lg px-3 py-2 w-full">
                                <option value="food" selected>美食類</option>
                                <option value="game">遊戲類</option>
                                <option value="handcraft">手工藝類</option>
                                <option value="merchandise">商品類</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="text-gray-500 text-xs block mb-1" for="booth-location">攤位位置</label>
                            <input type="text" id="booth-location" value="A區 - 第3排 - 5號" class="border rounded-lg px-3 py-2 w-full">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-gray-500 text-xs block mb-1" for="open-time">開始時間</label>
                                <input type="time" id="open-time" value="09:00" class="border rounded-lg px-3 py-2 w-full">
                            </div>
                            <div>
                                <label class="text-gray-500 text-xs block mb-1" for="close-time">結束時間</label>
                                <input type="time" id="close-time" value="17:00" class="border rounded-lg px-3 py-2 w-full">
                            </div>
                        </div>
                        
                        <div>
                            <label class="text-gray-500 text-xs block mb-1" for="booth-description">攤位介紹</label>
                            <textarea id="booth-description" rows="3" class="border rounded-lg px-3 py-2 w-full">提供各式各樣的美味小食，包括炸雞、薯條、漢堡等。使用新鮮食材，現點現做！</textarea>
                        </div>
                    </div>
                    
                    <div class="flex justify-end space-x-3 mt-4">
                        <button onclick="toggleEditMode()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700">
                            取消
                        </button>
                        <button onclick="saveChanges()" class="px-4 py-2 bg-blue-500 text-white rounded-lg">
                            儲存變更
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部導航欄 -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 py-2">
        <div class="grid grid-cols-4 gap-1 max-w-md mx-auto">
            <a href="boothReceive.html" class="flex flex-col items-center text-gray-500">
                <i class="fas fa-qrcode text-xl"></i>
                <span class="text-xs mt-1">收款</span>
            </a>
            <a href="boothGame.html" class="flex flex-col items-center text-gray-500">
                <i class="fas fa-tasks text-xl"></i>
                <span class="text-xs mt-1">任務</span>
            </a>
            <a href="boothSetting.html" class="flex flex-col items-center text-blue-500">
                <i class="fas fa-store text-xl"></i>
                <span class="text-xs mt-1">攤位管理</span>
            </a>
            <a href="boothAccount.html" class="flex flex-col items-center text-gray-500">
                <i class="fas fa-user-circle text-xl"></i>
                <span class="text-xs mt-1">帳號</span>
            </a>
        </div>
    </nav>

    <script>
        // 切換編輯模式
        function toggleEditMode() {
            const viewMode = document.getElementById('view-mode');
            const editMode = document.getElementById('edit-mode');
            
            if (viewMode.classList.contains('hidden')) {
                viewMode.classList.remove('hidden');
                editMode.classList.add('hidden');
            } else {
                viewMode.classList.add('hidden');
                editMode.classList.remove('hidden');
            }
        }
        
        // 預覽攤位圖片
        function previewImage(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    document.getElementById('booth-image-preview').src = e.target.result;
                }
                
                reader.readAsDataURL(input.files[0]);
            }
        }
        
        // 儲存編輯變更
        function saveChanges() {
            // 模擬儲存操作
            alert('資料已更新');
            toggleEditMode();
        }
    </script>
</body>
</html>
